name: DogCoachStudio
options:
  bundleIdPrefix: studio.dogcoach
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 32ZWRSU45R
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  DogCoachStudio:
    type: application
    platform: iOS
    sources:
      - path: DogCoachStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagile.dogcoach
        PRODUCT_MODULE_NAME: DogCoachStudio
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_KEY_CFBundleDisplayName: DogCoach Studio
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock DogCoach Studio and protect private training data."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a profile photo for a dog."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a profile photo for a dog."
        INFOPLIST_KEY_NSContactsUsageDescription: "Import clients from Apple Contacts or save a client to Contacts."
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      storeKitConfiguration: DogCoachStudio/Resources/StoreKit/Products.storekit
      testTargets:
        - DogCoachStudioTests
        - DogCoachStudioUITests
  DogCoachStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DogCoachStudioTests
    dependencies:
      - target: DogCoachStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagile.dogcoach.tests
  DogCoachStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DogCoachStudioUITests
    dependencies:
      - target: DogCoachStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagile.dogcoach.uitests
